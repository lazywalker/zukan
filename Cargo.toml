[package]
name = "zukan"
version = "0.2.11"
edition = "2024"
description = "Monster Hunter bestiary in your terminal"
license = "MIT"
repository = "https://github.com/lazywalker/zukan"
homepage = "https://github.com/lazywalker/zukan"
readme = "README.md"
keywords = ["monster-hunter", "cli", "terminal", "sprites"]
categories = ["command-line-utilities"]
exclude = [
    ".github/**",
    "Makefile",
    "DEVELOPING.md",
    "docs/**",
    "assets/**",
    "rustfmt.toml",
    "target/**",
    "tests/**",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.9"
dirs = "6"
toml = "0.8"
thiserror = "2"

[build-dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
tar = "0.4"
flate2 = "1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
opt-level = "z"

# [profile.release]
# panic = "abort"
# lto = true
# codegen-units = 1
# strip = true

[package.metadata.deb]
maintainer = "lazywalker <lazywalker@example.com>"
section = "utils"
priority = "optional"
extended-description = """\
zukan renders Monster Hunter creature and item icons as half-block ANSI art
in the terminal, with an optional neofetch-style info card. All icon and data
assets are embedded at compile time — a single offline binary."""
depends = "$auto"
assets = [
    ["target/release/zukan", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/zukan/README", "644"],
    ["LICENSE", "usr/share/doc/zukan/LICENSE", "644"],
]

