# release.yml — build zukan for the full target matrix and publish to GitHub
# Releases. Triggered by version tags (v*).
#
# Tarball/zip targets (8, ripgrep-compatible):
#   x86_64-unknown-linux-gnu       native ubuntu-latest       (+ .deb)
#   x86_64-unknown-linux-musl      cross, static
#   aarch64-unknown-linux-gnu      native ubuntu-24.04-arm    (+ .deb)
#   aarch64-unknown-linux-musl     cross, static
#   x86_64-apple-darwin            cross from macos-latest
#   aarch64-apple-darwin           native macos-latest
#   x86_64-pc-windows-msvc         native windows-latest
#   aarch64-pc-windows-msvc        cross from windows-latest
#
# Deb-only targets (cross, no tarball):
#   armv7-unknown-linux-gnueabihf  32-bit ARM (RPi 3/older)   → armhf
#   i686-unknown-linux-gnu         32-bit x86                 → i386
#
# musl always ships as a plain tarball (Alpine/scratch/distroless users want
# tarballs, not .deb). .deb is produced for the four linux-gnu targets.
#

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed by softprops/action-gh-release to create the release

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Tarball/zip targets ---
          # Linux GNU — native, with .deb
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              cross: false,
              archive: tar.gz,
              deb: true,
              tarball: true,
            }
          - {
              os: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-gnu,
              cross: false,
              archive: tar.gz,
              deb: true,
              tarball: true,
            }
          # Linux musl — cross (Docker), static binary, tarball only
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-musl,
              cross: true,
              archive: tar.gz,
              deb: false,
              tarball: true,
            }
          - {
              os: ubuntu-latest,
              target: aarch64-unknown-linux-musl,
              cross: true,
              archive: tar.gz,
              deb: false,
              tarball: true,
            }
          # macOS — native build, both arches cross from macos-latest
          - {
              os: macos-latest,
              target: aarch64-apple-darwin,
              cross: false,
              archive: tar.gz,
              deb: false,
              tarball: true,
            }
          - {
              os: macos-latest,
              target: x86_64-apple-darwin,
              cross: false,
              archive: tar.gz,
              deb: false,
              tarball: true,
            }
          # Windows MSVC — native + cross-arch
          - {
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              cross: false,
              archive: zip,
              deb: false,
              tarball: true,
            }
          - {
              os: windows-latest,
              target: aarch64-pc-windows-msvc,
              cross: false,
              archive: zip,
              deb: false,
              tarball: true,
            }
          # --- Deb-only targets (cross, no tarball) ---
          # 32-bit ARM (RPi 3/older devices). cross builds the binary, then
          # cargo-deb packages it on the host (--no-build).
          - {
              os: ubuntu-latest,
              target: armv7-unknown-linux-gnueabihf,
              cross: true,
              archive: "",
              deb: true,
              tarball: false,
            }
          # 32-bit x86 (legacy/i386 distros).
          - {
              os: ubuntu-latest,
              target: i686-unknown-linux-gnu,
              cross: true,
              archive: "",
              deb: true,
              tarball: false,
            }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache the host cargo registry + build artifacts per-target.
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          key: ${{ matrix.target }}

      # `make download` uses curl+tar (works on every runner) and is more
      # reliable than build.rs's ureq path behind some CI networks. Doing it
      # here means build.rs sees assets/ already populated and skips its own
      # download.
      - name: Populate assets
        shell: bash
        run: make download

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build .deb (linux-gnu targets)
        if: matrix.deb
        run: |
          cargo install cargo-deb --locked
          # --no-build: the binary was already built above (cross or native);
          # cargo-deb just packages the existing target/<triple>/release/zukan.
          cargo deb --target ${{ matrix.target }} --no-build

      - name: Stage tarball/zip
        if: matrix.tarball
        shell: bash
        run: |
          set -euo pipefail
          # Derive the version (strip leading 'v' from tag) for asset naming.
          VERSION="${GITHUB_REF_NAME#v}"
          # workflow_dispatch (no tag) → fall back to the crate version.
          if [ -z "$VERSION" ] || [ "$VERSION" = "${GITHUB_REF_NAME}" ]; then
            VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          fi
          STAGE="stage/zukan-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          # Copy the freshly built binary into the stage dir.
          BIN_NAME="zukan"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            BIN_EXT=".exe"
          else
            BIN_EXT=""
          fi
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${BIN_EXT}" "$STAGE/"
          # Ship license + readme alongside the binary.
          [ -f LICENSE ]  && cp LICENSE  "$STAGE/" || true
          [ -f README.md ] && cp README.md "$STAGE/" || true

          cd stage
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "../zukan-${VERSION}-${{ matrix.target }}.zip" "zukan-${VERSION}-${{ matrix.target }}"
          else
            tar czf "../zukan-${VERSION}-${{ matrix.target }}.tar.gz" "zukan-${VERSION}-${{ matrix.target }}"
          fi
          cd ..

      - name: Stage .deb
        if: matrix.deb
        shell: bash
        run: |
          # cargo-deb writes target/<triple>/debian/zukan_<version>_<arch>.deb
          # Move it to a predictable top-level name keyed by the triple.
          DEB_PATH="$(find target/${{ matrix.target }}/debian -name '*.deb' | head -1)"
          if [ -n "$DEB_PATH" ]; then
            cp "$DEB_PATH" "./zukan-${{ matrix.target }}.deb"
          else
            echo "::error::no .deb found under target/${{ matrix.target }}/debian/"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zukan-${{ matrix.target }}
          if-no-files-found: error
          path: |
            zukan-*.tar.gz
            zukan-*.zip
            zukan-*.deb

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    # Only publish when triggered by a tag. workflow_dispatch runs build the
    # artifacts (useful for smoke-testing the matrix) but don't publish.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # All staged files live directly under artifacts/ (merge-multiple).
          files: artifacts/*

  publish-crates:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    # Only publish when triggered by a tag (matches the GitHub Release job).
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.1

      # `cargo publish` runs build.rs, which needs assets/ populated. The .crate
      # ships only assets/.gitkeep (the 6 MB payload is excluded), so build.rs
      # downloads via ureq during the crates.io verification build. Pre-populate
      # here so the local verification step (before upload) uses curl+tar.
      - name: Populate assets
        run: make download

      - name: cargo publish
        # Auth via CARGO_REGISTRY_TOKEN env var (the modern path; --token flag
        # is deprecated). Verification is left ON (don't add --no-verify) -- if
        # the build fails on crates.io's servers (ureq can't reach GitHub), we
        # want to know, not ship a broken crate.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

