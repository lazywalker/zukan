# release.yml — build zukan for the full target matrix and publish to GitHub
# Releases. Triggered by version tags (v*).
#
# Target coverage (8 targets, ripgrep-compatible):
#   x86_64-unknown-linux-gnu       tar.gz + .deb   (native ubuntu-latest)
#   x86_64-unknown-linux-musl      tar.gz          (cross, static)
#   aarch64-unknown-linux-gnu      tar.gz + .deb   (native ubuntu-24.04-arm)
#   aarch64-unknown-linux-musl     tar.gz          (cross, static)
#   x86_64-apple-darwin            tar.gz          (cross from macos-latest)
#   aarch64-apple-darwin           tar.gz          (native macos-latest)
#   x86_64-pc-windows-msvc         zip             (native windows-latest)
#   aarch64-pc-windows-msvc        zip             (cross from windows-latest)
#
# musl always ships as a plain tarball (Alpine/scratch/distroless users want
# tarballs, not .deb). .deb is produced only for the two linux-gnu targets.
#
# All runtime deps are pure Rust (no C deps in the binary), and build-deps
# (ureq/ring, tar, flate2) compile for the HOST only — so cross-compilation is
# straightforward. `cross` is used for the two musl targets (handles the musl
# toolchain via Docker); everything else builds natively on its runner.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed by softprops/action-gh-release to create the release

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU — native, with .deb
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              cross: false,
              archive: tar.gz,
              deb: true,
            }
          - {
              os: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-gnu,
              cross: false,
              archive: tar.gz,
              deb: true,
            }
          # Linux musl — cross (Docker), static binary, tarball only
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-musl,
              cross: true,
              archive: tar.gz,
              deb: false,
            }
          - {
              os: ubuntu-latest,
              target: aarch64-unknown-linux-musl,
              cross: true,
              archive: tar.gz,
              deb: false,
            }
          # macOS — native build, both arches cross from macos-latest
          - {
              os: macos-latest,
              target: aarch64-apple-darwin,
              cross: false,
              archive: tar.gz,
              deb: false,
            }
          - {
              os: macos-latest,
              target: x86_64-apple-darwin,
              cross: false,
              archive: tar.gz,
              deb: false,
            }
          # Windows MSVC — native + cross-arch
          - {
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              cross: false,
              archive: zip,
              deb: false,
            }
          - {
              os: windows-latest,
              target: aarch64-pc-windows-msvc,
              cross: false,
              archive: zip,
              deb: false,
            }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache the host cargo registry + build artifacts per-target.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `make download` uses curl+tar (works on every runner) and is more
      # reliable than build.rs's ureq path behind some CI networks. Doing it
      # here means build.rs sees assets/ already populated and skips its own
      # download.
      - name: Populate assets
        shell: bash
        run: make download

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build .deb (linux-gnu only)
        if: matrix.deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --target ${{ matrix.target }} --no-build

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Derive the version (strip leading 'v' from tag) for asset naming.
          VERSION="${GITHUB_REF_NAME#v}"
          # workflow_dispatch (no tag) → fall back to the crate version.
          if [ -z "$VERSION" ] || [ "$VERSION" = "${GITHUB_REF_NAME}" ]; then
            VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          fi
          STAGE="stage/zukan-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          # Copy the freshly built binary into the stage dir.
          BIN_NAME="zukan"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            BIN_EXT=".exe"
          else
            BIN_EXT=""
          fi
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${BIN_EXT}" "$STAGE/"
          # Ship license + readme alongside the binary.
          [ -f LICENSE ]  && cp LICENSE  "$STAGE/" || true
          [ -f README.md ] && cp README.md "$STAGE/" || true

          cd stage
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "../zukan-${VERSION}-${{ matrix.target }}.zip" "zukan-${VERSION}-${{ matrix.target }}"
          else
            tar czf "../zukan-${VERSION}-${{ matrix.target }}.tar.gz" "zukan-${VERSION}-${{ matrix.target }}"
          fi
          cd ..

      - name: Stage .deb
        if: matrix.deb
        shell: bash
        run: |
          # cargo-deb writes target/<triple>/debian/zukan_<version>_<arch>.deb
          # Move it to a predictable top-level name.
          DEB_PATH="$(find target/${{ matrix.target }}/debian -name '*.deb' | head -1)"
          if [ -n "$DEB_PATH" ]; then
            cp "$DEB_PATH" "./zukan-${{ matrix.target }}.deb"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zukan-${{ matrix.target }}
          if-no-files-found: error
          path: |
            zukan-*.tar.gz
            zukan-*.zip
            zukan-*.deb

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    # Only publish when triggered by a tag. workflow_dispatch runs build the
    # artifacts (useful for smoke-testing the matrix) but don't publish.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # All staged files live directly under artifacts/ (merge-multiple).
          files: artifacts/*
